<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA Study Planner — August 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <span class="logo-mark">CPA</span>
      <div class="header-text">
        <h1>Study Planner</h1>
        <p class="subtitle">KASNEB Foundation Level · August 2025</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">

        
      </div>
      <div class="stat-pill">
        <span class="stat-num">~130</span>
        <span class="stat-lbl">study hours</span>
      </div>
      <div class="stat-pill exam-pill">
        <span class="stat-num">Aug 23</span>
        <span class="stat-lbl">exam day</span>
      </div>
    </div>
  </div>
</header>

<nav class="subject-nav">
  <button class="nav-btn active" data-filter="all">All subjects</button>
  <button class="nav-btn" data-filter="FA" data-color="fa">
    <span class="nav-dot"></span>Financial Accounting
  </button>
  <button class="nav-btn" data-filter="ECON" data-color="econ">
    <span class="nav-dot"></span>Economics
  </button>
  <button class="nav-btn" data-filter="LAW" data-color="law">
    <span class="nav-dot"></span>Intro to Law
  </button>
  <button class="nav-btn" data-filter="QA" data-color="qa">
    <span class="nav-dot"></span>Quant. Analysis
  </button>
</nav>

<main>
  <div class="syllabus-grid" id="syllabus-grid"></div>
  <div class="timetable-wrap" id="timetable"></div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">&#x2715;</button>
    <div class="modal-tag" id="modal-tag"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-date" id="modal-date"></p>
    <div class="modal-topic-block" id="modal-topic-block"></div>
    <div class="modal-prev-block" id="modal-prev-block"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
