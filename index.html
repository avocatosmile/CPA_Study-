<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA Study Planner — August 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <span class="logo-mark">CPA</span>
      <div class="header-text">
        <h1>Study Planner</h1>
        <p class="subtitle">KASNEB Foundation Level · August 2026</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="stat-num" id="days-left">—</span>
        <span class="stat-lbl">days left</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="overall-pct">0%</span>
        <span class="stat-lbl">complete</span>
      </div>
      <div class="stat-pill exam-pill">
        <span class="stat-num">Aug 20</span>
        <span class="stat-lbl">exam day</span>
      </div>
    </div>
  </div>
</header>

<!-- Tab bar -->
<div class="tab-bar">
  
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Checklist
  </button>
  <!-- subject filter — only visible on timetable tab -->
  <div class="tab-spacer"></div>
  <div class="subject-filters" id="subject-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="FA"><span class="fdot fa-dot"></span>FA</button>
    <button class="filter-btn" data-filter="ECON"><span class="fdot econ-dot"></span>Econ</button>
    <button class="filter-btn" data-filter="LAW"><span class="fdot law-dot"></span>Law</button>
    <button class="filter-btn" data-filter="QA"><span class="fdot qa-dot"></span>QA</button>
  </div>
</div>

<!-- TIMETABLE TAB -->
<main id="tab-timetable" class="tab-content active">
  <div class="syllabus-grid" id="syllabus-grid"></div>
  <div class="timetable-wrap" id="timetable"></div>
</main>

<!-- CHECKLIST TAB -->
<main id="tab-checklist" class="tab-content checklist-main">
  <div class="checklist-subject-tabs" id="checklist-subject-tabs">
    <button class="cl-tab active" data-subject="FA">Financial Accounting</button>
    <button class="cl-tab" data-subject="ECON">Economics</button>
    <button class="cl-tab" data-subject="LAW">Intro to Law</button>
    <button class="cl-tab" data-subject="QA">Quant. Analysis</button>
  </div>
  <div id="checklist-content"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">&#x2715;</button>
    <div class="modal-tag" id="modal-tag"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-date" id="modal-date"></p>
    <div class="modal-topic-block" id="modal-topic-block"></div>
    <div class="modal-prev-block" id="modal-prev-block"></div>
    <button class="modal-done-btn" id="modal-done-btn">Mark session as done</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
